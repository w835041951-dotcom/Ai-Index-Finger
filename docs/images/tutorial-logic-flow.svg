<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">读取页面状态并进行条件处理的工作流</title>
  <desc id="desc">启动应用、等待状态元素、读取到变量、条件分支、重复检查和结束。</desc>
  <rect width="1200" height="760" fill="#f7f8f5"/>
  <text x="70" y="65" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#17252a">示例：读取状态 → 判断 → 重复检查</text>
  <g font-family="Segoe UI, sans-serif" font-size="18">
    <path d="M250 125v510" stroke="#9aacaf" stroke-width="4"/>
    <g transform="translate(95 105)"><rect width="310" height="72" rx="8" fill="#1f6f78"/><text x="155" y="31" text-anchor="middle" fill="#fff" font-weight="700">1 · 启动应用</text><text x="155" y="56" text-anchor="middle" fill="#d8eff1" font-size="14">Launch app</text></g>
    <g transform="translate(95 205)"><rect width="310" height="72" rx="8" fill="#fff" stroke="#1f6f78" stroke-width="3"/><text x="155" y="31" text-anchor="middle" fill="#17252a" font-weight="700">2 · 等待“状态”元素</text><text x="155" y="56" text-anchor="middle" fill="#4b5b5f" font-size="14">Wait for node</text></g>
    <g transform="translate(95 305)"><rect width="310" height="72" rx="8" fill="#fff" stroke="#db9b2b" stroke-width="3"/><text x="155" y="31" text-anchor="middle" fill="#17252a" font-weight="700">3 · 读取文本 → status</text><text x="155" y="56" text-anchor="middle" fill="#8c5b08" font-size="14">Read node text</text></g>
    <g transform="translate(95 405)"><path d="M155 0 310 70 155 140 0 70Z" fill="#17252a"/><text x="155" y="62" text-anchor="middle" fill="#fff" font-weight="700">status 包含</text><text x="155" y="87" text-anchor="middle" fill="#e8c766">“需要刷新”？</text></g>
    <path d="M405 475h150" stroke="#d15b3f" stroke-width="4"/><text x="465" y="462" fill="#d15b3f" font-weight="700">为真</text>
    <path d="M250 545v65h305" fill="none" stroke="#657b83" stroke-width="4"/><text x="315" y="592" fill="#657b83" font-weight="700">为假</text>
    <g transform="translate(555 430)"><rect width="250" height="88" rx="8" fill="#d15b3f"/><text x="125" y="38" text-anchor="middle" fill="#fff" font-weight="700">点击“刷新”</text><text x="125" y="65" text-anchor="middle" fill="#ffe6df" font-size="14">Click</text></g>
    <g transform="translate(555 565)"><rect width="250" height="88" rx="8" fill="#657b83"/><text x="125" y="38" text-anchor="middle" fill="#fff" font-weight="700">短暂等待</text><text x="125" y="65" text-anchor="middle" fill="#e8edef" font-size="14">Delay</text></g>
    <path d="M805 474h95v135h-95" fill="none" stroke="#9aacaf" stroke-width="4"/>
    <g transform="translate(900 485)"><rect width="240" height="160" rx="8" fill="#fff" stroke="#db9b2b" stroke-width="4"/><text x="120" y="38" text-anchor="middle" fill="#17252a" font-weight="700">重复 3 次</text><text x="120" y="68" text-anchor="middle" fill="#8c5b08" font-size="14">Repeat</text><line x1="25" y1="88" x2="215" y2="88" stroke="#e5ded0"/><text x="120" y="116" text-anchor="middle" fill="#4b5b5f" font-size="15">等待 1 秒</text><text x="120" y="142" text-anchor="middle" fill="#4b5b5f" font-size="15">重新读取 status</text></g>
  </g>
  <text x="70" y="710" font-family="Segoe UI, sans-serif" font-size="17" fill="#4b5b5f">关键点：用“等待元素”同步页面，用变量承接读取结果，用有限循环控制重复次数。</text>
</svg>